<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<link rel="canonical" href="{{CANONICAL}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:site_name" content="AI 日报">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23c2410c'/%3E%3Ctext x='16' y='22' font-size='17' font-family='-apple-system,sans-serif' font-weight='700' fill='%23fff' text-anchor='middle'%3EAI%3C/text%3E%3C/svg%3E">
<link rel="alternate" type="application/rss+xml" title="AI 日报" href="https://yawnzhao.github.io/ai-daily/feed.xml">
<style>
  :root {
    --bg: #f7f7f9;
    --card: #ffffff;
    --card-hover: #fafafc;
    --border: #e5e5ea;
    --accent: #e8794c;
    --accent-dim: #d26a3c;
    --accent-text: #c2410c;
    --text: #1a1a1f;
    --text-dim: #4a4a54;
    --text-muted: #6e6e78;
    --tag-bg: #f0f0f5;
    --green: #16a34a;
    --blue: #2563eb;
    --red: #dc2626;
    --yellow: #d97706;
    --purple: #7c3aed;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
    max-width: 860px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }


  .issue-nav { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 0 0 28px; font-size: 14px; }
  .issue-nav a { color: var(--accent-text); text-decoration: none; border: 1px solid var(--border); background: var(--card); border-radius: 999px; padding: 6px 14px; }
  .issue-nav a:hover { border-color: var(--accent-dim); }
  .issue-nav .spacer { margin-left: auto; }
  .issue-nav-bottom { margin: 36px 0 0; border-top: 1px solid var(--border); padding-top: 24px; }
  .play-btn:focus-visible, .progress-bar:focus-visible, .issue-nav a:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }

  .header { text-align: center; padding: 40px 0 32px; border-bottom: 1px solid var(--border); margin-bottom: 40px; }
  .header .logo { font-size: 14px; letter-spacing: 4px; color: var(--accent-text); text-transform: uppercase; margin-bottom: 12px; font-weight: 600; }
  .header h1 { font-size: 32px; font-weight: 800; margin-bottom: 8px; color: var(--text); }
  .header .date { font-size: 15px; color: var(--text-dim); }
  .header .stats { display: flex; justify-content: center; gap: 24px; margin-top: 20px; flex-wrap: wrap; }
  .header .stat { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-muted); }
  .header .stat .num { color: var(--accent-text); font-weight: 700; font-size: 16px; }

  .section { margin-bottom: 48px; }
  .section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .section-header .icon { font-size: 22px; }
  .section-header h2 { font-size: 20px; font-weight: 700; }
  .section-header .tag { font-size: 12px; color: var(--text-muted); margin-left: auto; background: var(--tag-bg); padding: 3px 10px; border-radius: 4px; }

  .focus-box { background: linear-gradient(135deg, rgba(232,121,76,0.12) 0%, rgba(232,121,76,0.03) 100%); border: 1px solid rgba(232,121,76,0.25); border-radius: 12px; padding: 20px 24px; margin-bottom: 24px; }
  .focus-box .label { font-size: 12px; color: var(--accent-text); font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; }
  .focus-box .content { font-size: 15px; line-height: 1.8; color: var(--text); }

  .news-item { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px 22px; margin-bottom: 12px; transition: background 0.2s, border-color 0.2s; }
  .news-item:hover { background: var(--card-hover); border-color: var(--accent-dim); }
  .news-item .news-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 6px; }
  .news-item .badge { flex-shrink: 0; font-size: 11px; padding: 2px 8px; border-radius: 3px; font-weight: 600; margin-top: 4px; }
  .badge-hot { background: rgba(248,113,113,0.15); color: var(--red); }
  .badge-model { background: rgba(96,165,250,0.15); color: var(--blue); }
  .badge-money { background: rgba(74,222,128,0.15); color: var(--green); }
  .badge-safety { background: rgba(251,191,36,0.15); color: var(--yellow); }
  .badge-policy { background: rgba(167,139,250,0.15); color: var(--purple); }
  .badge-infra { background: rgba(232,121,76,0.15); color: var(--accent-text); }

  .news-item h3 { font-size: 16px; font-weight: 600; line-height: 1.5; }
  .news-item p { font-size: 14px; color: var(--text-dim); line-height: 1.7; margin-top: 4px; }
  .news-item .source { font-size: 12px; color: var(--text-muted); margin-top: 8px; }
  .news-item a { color: var(--accent-text); text-decoration: none; }
  .news-item a:hover { text-decoration: underline; }

  .insight-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .insight-card .insight-banner { background: linear-gradient(135deg, #fff7f2 0%, #fff 100%); padding: 24px 28px; border-bottom: 1px solid var(--border); }
  .insight-card .insight-banner .meta { font-size: 12px; color: var(--accent-text); font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; }
  .insight-card .insight-banner h3 { font-size: 19px; font-weight: 700; line-height: 1.5; }
  .insight-card .insight-body { padding: 24px 28px; }
  .insight-card .insight-body p { font-size: 14px; color: var(--text-dim); line-height: 1.85; margin-bottom: 16px; }
  .insight-card .insight-body strong { color: var(--text); font-weight: 600; }
  .insight-card .key-points { list-style: none; padding: 0; margin: 16px 0; }
  .insight-card .key-points li { font-size: 14px; color: var(--text-dim); padding: 6px 0 6px 18px; position: relative; line-height: 1.7; }
  .insight-card .key-points li::before { content: '\25B8'; position: absolute; left: 0; color: var(--accent-text); }

  .oneliner { background: rgba(232,121,76,0.08); border-left: 3px solid var(--accent); padding: 14px 20px; border-radius: 0 8px 8px 0; margin-top: 20px; font-size: 15px; font-weight: 600; color: var(--text); line-height: 1.6; }

  .paper-item { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px; margin-bottom: 16px; transition: background 0.2s, border-color 0.2s; }
  .paper-item:hover { background: var(--card-hover); border-color: var(--accent-dim); }
  .paper-item .paper-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
  .paper-item .paper-num { flex-shrink: 0; font-size: 18px; font-weight: 800; color: var(--accent-text); min-width: 28px; }
  .paper-item .paper-title { font-size: 16px; font-weight: 600; line-height: 1.5; color: var(--text); }
  .paper-item .paper-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .paper-item .paper-tag { font-size: 11px; color: var(--text-muted); background: var(--tag-bg); padding: 2px 8px; border-radius: 3px; }
  .paper-item .paper-body { font-size: 14px; color: var(--text-dim); line-height: 1.85; margin-bottom: 12px; }
  .paper-item .paper-body strong { color: var(--text); font-weight: 600; }
  .paper-item .paper-takeaways { list-style: none; padding: 0; margin: 0 0 12px 0; border-left: 2px solid rgba(232,121,76,0.3); padding-left: 16px; }
  .paper-item .paper-takeaways li { font-size: 13px; color: var(--text-dim); line-height: 1.7; padding: 3px 0; }
  .paper-item .paper-link { font-size: 12px; color: var(--accent-text); text-decoration: none; }
  .paper-item .paper-link:hover { text-decoration: underline; }
  .paper-also { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; margin-top: 16px; }
  .paper-also .paper-also-title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 10px; }
  .paper-also .paper-also-item { display: flex; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--text-dim); line-height: 1.6; }
  .paper-also .paper-also-item:last-child { border-bottom: none; }
  .paper-also .paper-also-num { color: var(--accent-text); font-weight: 700; flex-shrink: 0; }
  .paper-also .paper-also-item a { color: var(--blue); text-decoration: none; font-size: 12px; }
  .paper-also .paper-also-item a:hover { text-decoration: underline; }
  .paper-observation { background: linear-gradient(135deg, rgba(37,99,235,0.06) 0%, rgba(37,99,235,0.02) 100%); border: 1px solid rgba(37,99,235,0.15); border-radius: 12px; padding: 18px 22px; margin-top: 20px; }
  .paper-observation .label { font-size: 12px; color: var(--blue); font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; }
  .paper-observation .content { font-size: 14px; line-height: 1.8; color: var(--text-dim); }
  .paper-observation .content strong { color: var(--text); }

  .oss-item { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; margin-bottom: 10px; display: flex; align-items: flex-start; gap: 14px; transition: background 0.2s, border-color 0.2s; }
  .oss-item:hover { background: var(--card-hover); border-color: var(--accent-dim); }
  .oss-rank { flex-shrink: 0; width: 28px; height: 28px; border-radius: 6px; background: var(--tag-bg); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--text-muted); }
  .oss-rank.top { background: rgba(232,121,76,0.15); color: var(--accent-text); }
  .oss-content { flex: 1; min-width: 0; }
  .oss-content .oss-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .oss-content .oss-name { font-size: 15px; font-weight: 600; color: var(--text); }
  .oss-content .oss-name a { color: var(--blue); text-decoration: none; }
  .oss-content .oss-name a:hover { text-decoration: underline; }
  .oss-stars { font-size: 12px; color: var(--yellow); font-weight: 600; }
  .oss-license { font-size: 11px; color: var(--text-muted); background: var(--tag-bg); padding: 1px 6px; border-radius: 3px; }
  .oss-content p { font-size: 13px; color: var(--text-dim); line-height: 1.6; }

  .audio-player { background: linear-gradient(135deg, #fff7f2 0%, #ffffff 100%); border: 1px solid var(--border); border-radius: 16px; padding: 24px 28px; margin-bottom: 40px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .audio-player .play-btn { flex-shrink: 0; width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dim) 100%); border: none; color: #fff; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.15s, box-shadow 0.2s; box-shadow: 0 4px 16px rgba(232,121,76,0.3); }
  .audio-player .play-btn:hover { transform: scale(1.08); box-shadow: 0 6px 24px rgba(232,121,76,0.45); }
  .audio-player .play-btn:active { transform: scale(0.95); }
  .audio-player .play-info { flex: 1; min-width: 200px; }
  .audio-player .play-label { font-size: 12px; color: var(--accent-text); font-weight: 700; letter-spacing: 1px; margin-bottom: 4px; }
  .audio-player .play-title { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .audio-player .play-meta { font-size: 13px; color: var(--text-muted); }
  .audio-player .progress-row { flex: 1 1 100%; display: flex; align-items: center; gap: 12px; margin-top: 8px; }
  .audio-player .current-time, .audio-player .duration-time { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; flex-shrink: 0; min-width: 36px; text-align: center; }
  .audio-player .progress-bar { flex: 1; height: 6px; background: var(--tag-bg); border-radius: 3px; overflow: hidden; cursor: pointer; position: relative; }
  .audio-player .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent) 0%, var(--accent-dim) 100%); border-radius: 3px; transition: width 0.1s linear; }
  .audio-player audio { display: none; }

  @media (max-width: 640px) {
    body { padding: 16px 14px 40px; }
    .header h1 { font-size: 24px; }
    .news-item, .oss-item { padding: 14px 16px; }
    .insight-card .insight-banner, .insight-card .insight-body { padding: 18px 20px; }
  }
</style>
</head>
<body>

<nav class="issue-nav" aria-label="日报导航" data-nav="top"></nav>

<!-- ===== Header ===== -->
<header class="header">
  <div class="logo">AI Daily Digest</div>
  <h1>AI 日报</h1>
  <div class="date"><time datetime="{{DATE}}">{{DATE_HUMAN}} · {{WEEKDAY}} · 第 {{VOL}} 期</time></div>
  <div class="stats">
    <div class="stat"><span class="num">4</span>个板块</div>
    <div class="stat"><span class="num">{{NEWS_COUNT}}</span>条资讯</div>
    <div class="stat"><span class="num">{{PAPER_COUNT}}</span>篇论文</div>
    <div class="stat"><span class="num">{{OSS_COUNT}}</span>个开源项目</div>
    <div class="stat">覆盖过去 <span class="num">{{WINDOW_HOURS}}</span> 小时</div>
  </div>
</header>

<!-- ===== Audio Player ===== -->
<div class="audio-player">
  <button class="play-btn" id="playBtn" type="button" aria-label="播放语音简报" onclick="togglePlay()">&#9654;</button>
  <div class="play-info">
    <div class="play-label">语音简报</div>
    <div class="play-title">AI 日报 · {{DATE_HUMAN}}</div>
    <div class="play-meta">语音版 · 小宇宙</div>
  </div>
  <div class="progress-row">
    <span class="current-time" id="currentTime">00:00</span>
    <div class="progress-bar" id="progressBar" role="slider" tabindex="0" aria-label="播放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" onclick="seekTo(event)" onkeydown="seekKey(event)">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <span class="duration-time" id="durationTime">--:--</span>
  </div>
  <audio id="audioPlayer" preload="metadata">
    您的浏览器不支持音频播放。
  </audio>
</div>

<script>
  /* 小宇宙音频直链：节目发布后填入；为空时显示"语音版即将上线" */
  var AUDIO_SRC = "{{AUDIO_SRC}}";  /* 小宇宙直链，未发布时留空 */
  var audio = document.getElementById('audioPlayer');
  if (AUDIO_SRC) {
    audio.src = AUDIO_SRC;
  } else {
    var metaEl = document.querySelector('.play-meta');
    if (metaEl) { metaEl.innerHTML = '语音版制作中 · <a href="https://www.xiaoyuzhoufm.com/podcast/6aa034c1002d4e51bf4b4f31" target="_blank" rel="noopener">前往小宇宙节目页</a>'; }
    var btnEl = document.getElementById('playBtn');
    if (btnEl) { btnEl.setAttribute('aria-disabled', 'true'); btnEl.setAttribute('aria-label', '语音版尚未上线'); }
  }
  var playBtn = document.getElementById('playBtn');
  var progressFill = document.getElementById('progressFill');
  var currentTimeEl = document.getElementById('currentTime');
  var durationTimeEl = document.getElementById('durationTime');
  var progressBar = document.getElementById('progressBar');
  var isPlaying = false;

  function togglePlay() {
    if (!audio.src) { return; }
    if (audio.paused) { audio.play(); playBtn.innerHTML = '&#10074;&#10074;'; isPlaying = true; }
    else { audio.pause(); playBtn.innerHTML = '&#9654;'; isPlaying = false; }
  }
  function formatTime(s) {
    if (isNaN(s)) return '--:--';
    var m = Math.floor(s / 60); var sec = Math.floor(s % 60);
    return (m < 10 ? '0' : '') + m + ':' + (sec < 10 ? '0' : '') + sec;
  }
  audio.addEventListener('loadedmetadata', function() { durationTimeEl.textContent = formatTime(audio.duration); });
  audio.addEventListener('timeupdate', function() {
    var pct = (audio.currentTime / audio.duration) * 100;
    progressFill.style.width = pct + '%';
    currentTimeEl.textContent = formatTime(audio.currentTime);
  });
  audio.addEventListener('ended', function() {
    playBtn.innerHTML = '&#9654;'; isPlaying = false;
    progressFill.style.width = '0%'; currentTimeEl.textContent = '00:00';
  });
  function seekTo(e) {
    var rect = progressBar.getBoundingClientRect();
    var x = (e.clientX || e.touches[0].clientX) - rect.left;
    var pct = x / rect.width;
    if (audio.duration) { audio.currentTime = pct * audio.duration; }
  }

  /* a11y 补丁：按钮状态、进度条键盘操作 */
  if (playBtn.getAttribute('aria-disabled') !== 'true') { playBtn.setAttribute('aria-label', '播放语音简报'); }
  audio.addEventListener('play', function() { playBtn.setAttribute('aria-label', '暂停语音简报'); });
  audio.addEventListener('pause', function() { playBtn.setAttribute('aria-label', '播放语音简报'); });
  audio.addEventListener('timeupdate', function() {
    progressBar.setAttribute('aria-valuenow', Math.round((audio.currentTime / audio.duration) * 100) || 0);
  });
  function seekKey(e) {
    if (!audio.src) { return; }
    if (e.key === ' ' || e.key === 'Enter') { togglePlay(); e.preventDefault(); return; }
    if (!audio.duration) { return; }
    var step = e.shiftKey ? 30 : 5;
    if (e.key === 'ArrowRight') { audio.currentTime = Math.min(audio.duration, audio.currentTime + step); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { audio.currentTime = Math.max(0, audio.currentTime - step); e.preventDefault(); }
  }
</script>

<main id="main">

<!-- 四个板块的结构见任意一期已发布页面；类名保持一致，不要新增自定义样式。
     每日精选：.section > .section-header + .focus-box + .news-item*
     行业洞见：.section > .insight-card > .insight-banner + .insight-body（内含 .focus-box、p、.key-points、.oneliner）
     论文速递：.section > .paper-item*
     开源解读：.section > .oss-item* + .oneliner
     所有外链写成 <a href="https://..." target="_blank" rel="noopener">。 -->
{{CONTENT}}

</main>

<nav class="issue-nav issue-nav-bottom" aria-label="日报导航" data-nav="bottom"></nav>

</body>
</html>
