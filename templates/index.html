<style>
  :root {
    --bg: #f7f7f9;
    --card: #ffffff;
    --card-hover: #fafafc;
    --border: #e5e5ea;
    --accent: #e8794c;
    --accent-dim: #d26a3c;
    --accent-text: #c2410c;
    --text: #1a1a1f;
    --text-dim: #4a4a54;
    --text-muted: #6e6e78;
    --tag-bg: #f0f0f5;
    --green: #16a34a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
    max-width: 860px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }
  .header { text-align: center; padding: 48px 0 36px; border-bottom: 1px solid var(--border); margin-bottom: 40px; }
  .header .logo { font-size: 14px; letter-spacing: 4px; color: var(--accent-text); text-transform: uppercase; margin-bottom: 12px; font-weight: 600; }
  .header h1 { font-size: 36px; font-weight: 800; margin-bottom: 10px; }
  .header .sub { font-size: 15px; color: var(--text-dim); }
  .header .stats { display: flex; justify-content: center; gap: 28px; margin-top: 24px; flex-wrap: wrap; }
  .header .stat { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-muted); }
  .header .stat .num { color: var(--accent-text); font-weight: 700; font-size: 18px; }
  .section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .section-header h2 { font-size: 20px; font-weight: 700; }
  .section-header .tag { font-size: 12px; color: var(--text-muted); margin-left: auto; background: var(--tag-bg); padding: 3px 10px; border-radius: 4px; }
  .episode { text-decoration: none; color: inherit; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 22px 26px; margin-bottom: 14px; display: flex; align-items: center; gap: 18px; transition: background 0.2s, border-color 0.2s, transform 0.15s; }
  .episode:hover { background: var(--card-hover); border-color: var(--accent-dim); transform: translateY(-1px); }
  .episode .vol { flex-shrink: 0; text-align: center; min-width: 58px; }
  .episode .vol .num { font-size: 26px; font-weight: 800; color: var(--accent-text); line-height: 1.2; }
  .episode .vol .label { font-size: 11px; color: var(--text-muted); letter-spacing: 1px; }
  .episode .info { flex: 1; min-width: 0; }
  .episode .info .title { font-size: 16px; font-weight: 700; color: var(--text); text-decoration: none; }
  .episode .info .title:hover { color: var(--accent-text); }
  .episode .info .desc { font-size: 13px; color: var(--text-dim); margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .episode .info .meta { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .episode .info .chip { font-size: 11px; color: var(--text-muted); background: var(--tag-bg); padding: 2px 8px; border-radius: 3px; }
  .episode .go { flex-shrink: 0; font-size: 13px; color: var(--accent-text); text-decoration: none; font-weight: 600; }
  .episode .go:hover { text-decoration: underline; }
  .about { background: linear-gradient(135deg, rgba(232,121,76,0.10) 0%, rgba(232,121,76,0.03) 100%); border: 1px solid rgba(232,121,76,0.25); border-radius: 12px; padding: 20px 24px; margin-top: 40px; }
  .about .label { font-size: 12px; color: var(--accent-text); font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; }
  .about .content { font-size: 14px; line-height: 1.9; color: var(--text-dim); }
  .about .content strong { color: var(--text); }
  .footer-note { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 48px; }
  .chip-pending { color: var(--text-muted); background: transparent; border: 1px dashed var(--border); }
  .subscribe { display: flex; justify-content: center; gap: 14px; margin-top: 20px; flex-wrap: wrap; }
  .subscribe a { font-size: 13px; color: var(--accent-text); text-decoration: none; border: 1px solid var(--border); background: var(--card); border-radius: 999px; padding: 6px 16px; }
  .subscribe a:hover { border-color: var(--accent-dim); }
  @media (max-width: 560px) {
    .episode { flex-direction: column; align-items: stretch; gap: 10px; }
    .episode .go { display: none; }
    .episode .vol { text-align: left; }
    .episode .vol .num { font-size: 22px; }
  }
</style>
